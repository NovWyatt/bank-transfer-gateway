name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pint, Larastan, Pest
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bank_transfer_gateway_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bank_transfer_gateway_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Lấy thư mục cache của Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Cài thư viện
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Chuẩn bị .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pest
        run: vendor/bin/pest

  secrets:
    name: Quét bí mật (gitleaks)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Gọi thẳng CLI thay cho gitleaks-action: action đó quét dải "commit_gốc^..", hỏng ở lần push đầu của repo mới.
      - name: Cài gitleaks (kiểm checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Quét toàn bộ lịch sử git
        run: gitleaks git --redact --no-banner --verbose
